name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # the two ONNX models are pinned by commit and checksum in the script
      - name: Cache face models
        uses: actions/cache@v4
        with:
          path: models/*.onnx
          key: face-models-${{ hashFiles('scripts/fetch-models.sh') }}

      - name: Fetch face models
        working-directory: .
        run: scripts/fetch-models.sh

      # integration tests start pgvector/pgvector:pg16 with Testcontainers (Docker is on the runner)
      - name: Build and test
        run: mvn -B verify

      # job logs need a login, so put the failing tests where anyone can see them
      - name: Show failed tests
        if: failure()
        run: |
          for f in $(grep -l -E "<<< (FAILURE|ERROR)" target/surefire-reports/*.txt target/failsafe-reports/*.txt 2>/dev/null); do
            echo "::error title=$(basename "$f" .txt)::$(grep -m1 -A3 -E '<<< (FAILURE|ERROR)' "$f" | tr '\n' ' ' | cut -c1-900)"
          done

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
