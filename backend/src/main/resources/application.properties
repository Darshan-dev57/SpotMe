spring.application.name=spotme

spring.datasource.url=${SPOTME_DB_URL:jdbc:postgresql://localhost:5434/spotme}
spring.datasource.username=${SPOTME_DB_USER:spotme}
spring.datasource.password=${SPOTME_DB_PASSWORD:spotme}
spring.datasource.hikari.maximum-pool-size=12

# Organizer uploads are one photo per request. Anything above 1 MB is streamed by
# Tomcat to a temp file instead of being held in memory.
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB
spring.servlet.multipart.file-size-threshold=1MB
server.tomcat.threads.max=40

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

spotme.storage-dir=${SPOTME_STORAGE_DIR:../data/storage}
spotme.models-dir=${SPOTME_MODELS_DIR:../models}
spotme.web-origin=${SPOTME_WEB_ORIGIN:http://localhost:3000}
# Signs short-lived media links. Leave empty locally and a random one is made at startup.
spotme.media-secret=${SPOTME_MEDIA_SECRET:}

spotme.upload.max-bytes=20000000
spotme.upload.max-pixels=40000000
spotme.upload.max-concurrent-decodes=2
spotme.upload.thumbnail-side=480

spotme.face.detect-score=0.8
spotme.face.max-side=1280
spotme.face.min-face-size=40
spotme.face.engines=2
spotme.face.opencv-threads=2

spotme.search.max-distance=0.60
spotme.search.max-results=200
spotme.search.per-minute-limit=10
spotme.search.media-link-ttl=10m

spotme.worker.enabled=true
spotme.worker.threads=2
spotme.worker.lease=2m
spotme.worker.poll-interval=500ms
spotme.worker.max-attempts=5
spotme.worker.expiry-sweep-interval=60s

spotme.eval.enabled=false
